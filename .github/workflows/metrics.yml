name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kripteks
          template: classic
          base: header, repositories
          config_timezone: Europe/Istanbul
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update metrics [skip ci]"
          filename: github-metrics-languages.svg

          repositories_forks: no
          repositories_affiliations: owner, organization_member
          users_ignored: EpicGames, Karaca-Tech

          plugin_languages: yes
          plugin_languages_skipped: smf-forum
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
