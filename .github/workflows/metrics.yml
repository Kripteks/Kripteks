name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kripteks
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update languages metrics [skip ci]"
          filename: github-metrics-languages.svg

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
