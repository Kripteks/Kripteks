name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kripteks
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          config_theme: tokyonight
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update languages metrics [skip ci]"
          filename: github-metrics-languages.svg

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_head: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 400
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
