<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <clipPath id="bar-clip">
      <rect width="380" height="8" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .card {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #c0caf5;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      fill: #7aa2f7;
    }
    .stat-label {
      font-size: 13px;
      fill: #7982a9;
    }
    .stat-val {
      font-size: 13px;
      font-weight: 600;
      fill: #c0caf5;
    }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .stat-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-icon {
      width: 16px;
      height: 16px;
      fill: #7aa2f7;
    }
    .divider {
      stroke: #24283b;
      stroke-width: 1.5;
    }
    .lang-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .lang-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #c0caf5;
    }
    .lang-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .lang-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-size {
      color: #565f89;
      font-size: 11px;
    }
    .lang-pct {
      color: #9aa5ce;
      font-size: 11px;
      font-weight: 600;
      min-width: 44px;
      text-align: right;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }
  </style>

  <!-- Background Card -->
  <rect width="820" height="220" rx="12" fill="url(#bg-grad)" stroke="#24283b" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="820" height="3" rx="1.5" fill="url(#accent-grad)"/>

  <!-- Left Section: Activity Stats -->
  <g transform="translate(24, 20)">
    <text x="0" y="16" class="title">⚡ GitHub Activity</text>
  </g>

  <foreignObject x="24" y="50" width="330" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" class="card">
      <div class="stat-row">
        <div class="stat-left">
          <svg class="stat-icon" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10.5 7.75a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm1.43.75a4.002 4.002 0 01-7.86 0H.75a.75.75 0 110-1.5h3.32a4.002 4.002 0 017.86 0h3.32a.75.75 0 110 1.5h-3.32z"/></svg>
          <span class="stat-label">Total Commits</span>
        </div>
        <span class="stat-val">604</span>
      </div>
      <div class="stat-row">
        <div class="stat-left">
          <svg class="stat-icon" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/></svg>
          <span class="stat-label">Pull Requests</span>
        </div>
        <span class="stat-val">40</span>
      </div>
      <div class="stat-row">
        <div class="stat-left">
          <svg class="stat-icon" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9 3a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.25a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z"/></svg>
          <span class="stat-label">Issues Opened</span>
        </div>
        <span class="stat-val">132</span>
      </div>
      <div class="stat-row">
        <div class="stat-left">
          <svg class="stat-icon" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-8a1 1 0 00-1 1v6.708A2.486 2.486 0 014.5 9h8V1.5z"/></svg>
          <span class="stat-label">Contributed To</span>
        </div>
        <span class="stat-val">15 repos</span>
      </div>
      <div class="stat-row">
        <div class="stat-left">
          <svg class="stat-icon" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
          <span class="stat-label">Total Stars Earned</span>
        </div>
        <span class="stat-val">1</span>
      </div>
    </div>
  </foreignObject>

  <!-- Vertical Divider -->
  <line x1="385" y1="20" x2="385" y2="200" class="divider"/>

  <!-- Right Section: Languages Breakdown -->
  <g transform="translate(415, 20)">
    <text x="0" y="16" class="title">🚀 Most Used Languages</text>
  </g>

  <!-- Language Progress Bar -->
  <g transform="translate(415, 48)" clip-path="url(#bar-clip)">
    <rect width="380" height="8" fill="#24283b"/>
    <rect x="0.00" y="0" width="274.32" height="8" fill="#7355dd" rx="0"/>
            <rect x="274.32" y="0" width="19.10" height="8" fill="#663399" rx="0"/>
            <rect x="293.43" y="0" width="18.83" height="8" fill="#00ADD8" rx="0"/>
            <rect x="312.25" y="0" width="18.55" height="8" fill="#3178c6" rx="0"/>
            <rect x="330.80" y="0" width="14.46" height="8" fill="#41b883" rx="0"/>
            <rect x="345.26" y="0" width="9.36" height="8" fill="#4F5D95" rx="0"/>
            <rect x="354.62" y="0" width="6.85" height="8" fill="#0060ac" rx="0"/>
            <rect x="361.46" y="0" width="5.07" height="8" fill="#f7523f" rx="0"/>
  </g>

  <!-- Languages List (2 columns) -->
  <foreignObject x="415" y="64" width="380" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" class="card">
      <div class="grid">
        <div>
          
        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#7355dd"></span>
            C#
          </div>
          <div class="lang-meta">
            <span class="lang-size">4.14 MB</span>
            <span class="lang-pct">72.19%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#00ADD8"></span>
            Go
          </div>
          <div class="lang-meta">
            <span class="lang-size">291.0 kB</span>
            <span class="lang-pct">4.95%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#41b883"></span>
            Vue
          </div>
          <div class="lang-meta">
            <span class="lang-size">223.4 kB</span>
            <span class="lang-pct">3.80%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#0060ac"></span>
            XML
          </div>
          <div class="lang-meta">
            <span class="lang-size">105.8 kB</span>
            <span class="lang-pct">1.80%</span>
          </div>
        </div>
        </div>
        <div>
          
        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#663399"></span>
            CSS
          </div>
          <div class="lang-meta">
            <span class="lang-size">295.3 kB</span>
            <span class="lang-pct">5.03%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#3178c6"></span>
            TypeScript
          </div>
          <div class="lang-meta">
            <span class="lang-size">286.7 kB</span>
            <span class="lang-pct">4.88%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#4F5D95"></span>
            PHP
          </div>
          <div class="lang-meta">
            <span class="lang-size">144.6 kB</span>
            <span class="lang-pct">2.46%</span>
          </div>
        </div>

        <div class="lang-item">
          <div class="lang-name">
            <span class="lang-dot" style="background:#f7523f"></span>
            Blade
          </div>
          <div class="lang-meta">
            <span class="lang-size">78.3 kB</span>
            <span class="lang-pct">1.33%</span>
          </div>
        </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>